<!doctype html>
<!--
  Source of docs/social-preview.png (1280×640, GitHub "Social preview").
  Re-render with any Chromium browser, e.g.:
    msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640
           --screenshot=docs/social-preview.png docs/social-preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Driftcha social preview</title>
    <style>
      html,
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 68px;
        background:
          radial-gradient(560px 380px at 27% 50%, rgba(139, 128, 255, 0.2), transparent 70%),
          radial-gradient(rgba(255, 255, 255, 0.055) 1.3px, transparent 1.7px) 0 0 / 22px 22px,
          #0c0c12;
        color: #ececf2;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }

      img {
        width: 248px;
        height: 248px;
        filter: drop-shadow(0 26px 50px rgba(0, 0, 0, 0.55));
      }

      h1 {
        margin: 0;
        font-size: 108px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .tagline {
        margin: 20px 0 0;
        color: #ada4ff;
        font-size: 34px;
        font-weight: 600;
      }

      .line {
        margin: 12px 0 0;
        color: #9a9aab;
        font-size: 26px;
      }

      .meta {
        display: flex;
        gap: 10px;
        margin-top: 34px;
      }

      .meta span {
        padding: 7px 15px;
        border: 1px solid #2d2d3a;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: #b6b6c6;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <img src="../demo/logo.svg" alt="" />
    <div>
      <h1>Driftcha</h1>
      <p class="tagline">A motion-defined noise CAPTCHA</p>
      <p class="line">Every frame is static. The digits only exist in motion.</p>
      <div class="meta">
        <span>Open source</span>
        <span>MIT</span>
        <span>Zero dependencies</span>
        <span>Server mode</span>
      </div>
    </div>
  </body>
</html>
