name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For security vulnerabilities, please follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Switch to "Mock server"
        3. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Mock server
        - Browser only
        - Both / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, OS and device
      placeholder: e.g. Safari 18 on iPhone 15, Chrome 140 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Driftcha version or commit
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
